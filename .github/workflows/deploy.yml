name: Deploy promptrc

on:
  repository_dispatch:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    if: github.event_name == 'repository_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        env:
          NODE_ENV: development

      - run: pnpm build
        env:
          NODE_ENV: production
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      # Migrations are additive, so applying them before the new Worker ships is
      # safe for the version still serving traffic. If this fails, nothing deploys.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: 'pnpm'
          command: d1 migrations apply promptrc --remote

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: 'pnpm'
          command: deploy
