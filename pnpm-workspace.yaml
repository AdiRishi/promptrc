allowBuilds:
  '@clerk/shared': true
  bufferutil: true
  core-js: true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  workerd: true
# pnpm 11 holds back releases younger than a day. These were current when the
# toolchain was upgraded (wrangler 4.147 comes in via @cloudflare/vitest-plugin);
# the exclusions can go once they age past the window.
minimumReleaseAgeExclude:
  - '@cloudflare/vitest-plugin@1.3.6'
  - wrangler@4.147.0
patchedDependencies:
  '@cloudflare/vitest-plugin@1.3.6': patches/@cloudflare__vitest-plugin@1.3.6.patch
peerDependencyRules:
  allowedVersions:
    # Vitest 5 support is backported via patches/@cloudflare__vitest-plugin@1.3.6.patch
    # (cloudflare/workers-sdk#15500). Drop both once an upstream release ships it.
    '@cloudflare/vitest-plugin>vitest': '5'
