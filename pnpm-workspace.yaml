allowBuilds:
  '@clerk/shared': true
  bufferutil: true
  core-js: true
  esbuild: true
  msw: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  workerd: true
# Only install releases that have been public for at least a day.
minimumReleaseAge: 1440
patchedDependencies:
  '@cloudflare/vitest-plugin@1.3.5': patches/@cloudflare__vitest-plugin@1.3.5.patch
peerDependencyRules:
  allowedVersions:
    # Vitest 5 support is backported via patches/@cloudflare__vitest-plugin@1.3.5.patch
    # (cloudflare/workers-sdk#15500). Drop both once an upstream release ships it.
    '@cloudflare/vitest-plugin>vitest': '5'
